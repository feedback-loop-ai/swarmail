name: CI

on:
  push:
  pull_request:

# Least privilege by default: every job runs with read-only repository
# access unless it grants itself more (AC52.2). The publish jobs ask for
# `packages: write`, the audit for its check annotations — everything else
# inherits this floor, so a compromised action can at most read the tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Style and lint once, on the fast runner. --locked: a stale Cargo.lock is
  # a red gate, never a silent dependency resolve. The publish guard's proof
  # rides this job because both publish jobs `needs:` it (decision 0018 §6):
  # a publish step may not execute guard logic that is red (decision 0019).
  quality:
    name: format, clippy, publish guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash scripts/publish-guard-test.sh
      - name: Prove packaged licenses and WHATWG attribution
        id: package-attribution
        run: |
          set -euo pipefail
          python3 - <<'PACKAGE'
          import hashlib, os, pathlib, shutil, subprocess, tarfile, tempfile, tomllib
          root = pathlib.Path.cwd()
          package = tomllib.loads((root / "Cargo.toml").read_text())["package"]
          target = root / "target/package-attribution"
          env = {**os.environ, "CARGO_TARGET_DIR": str(target)}
          with tempfile.TemporaryDirectory(prefix="package-attribution-") as scratch:
              repo = pathlib.Path(scratch)
              for directory in ("src", "tests", "benches", "assets"):
                  shutil.copytree(root / directory, repo / directory)
              (repo / "scripts/data").mkdir(parents=True)
              files = ("LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "scripts/data/html-entities.json")
              for name in (*files, "Cargo.toml", "Cargo.lock", "README.md"):
                  shutil.copy(root / name, repo / name)
              (repo / ".gitignore").write_text(".cargo-home/\n")
              def run(*args):
                  return subprocess.run(args, cwd=repo, env=env, check=True, capture_output=True, text=True).stdout
              run("git", "init", "-q")
              run("git", "add", ".")
              run("git", "-c", "user.name=package-proof", "-c", "user.email=package-proof@invalid", "-c", "commit.gpgsign=false", "commit", "-qm", "Prepare isolated package proof")
              decoy = repo / ".cargo-home/registry/src/cache/decoy"
              decoy.mkdir(parents=True)
              for name in ("LICENSE-MIT", "LICENSE-APACHE"):
                  (decoy / name).write_text("cache license decoy\n")
              listed = run("cargo", "package", "--list", "--locked").splitlines()
              assert all(name in listed for name in files), listed
              assert not any(".cargo-home/" in name for name in listed), listed
              manifest = (repo / "Cargo.toml").read_text()
              (repo / "Cargo.toml").write_text(manifest.replace('"/LICENSE-MIT"', '"LICENSE-MIT"').replace('"/LICENSE-APACHE"', '"LICENSE-APACHE"'))
              red = subprocess.run(["cargo", "package", "--list", "--locked", "--allow-dirty"], cwd=repo, env=env, capture_output=True, text=True)
              assert ".cargo-home/" in red.stdout if red.returncode == 0 else (".cargo-home/" in red.stderr and "failed to parse manifest" in red.stderr), "unanchored mutant did not expose cache traversal"
              print("unanchored mutation: real cache traversal observed; exit", red.returncode)
              (repo / "Cargo.toml").write_text(manifest)
              restored = run("cargo", "package", "--list", "--locked").splitlines()
              assert restored == listed, "restored package differs"
              run("cargo", "package", "--locked")
              stem = package["name"] + "-" + package["version"]
              with tarfile.open(target / "package" / (stem + ".crate")) as archive:
                  for name in files:
                      actual = archive.extractfile(stem + "/" + name).read()
                      assert actual == (root / name).read_bytes(), name
                      print(name, hashlib.sha256(actual).hexdigest())
                  assert not any(".cargo-home/" in name for name in archive.getnames())
          print("packaging: actual listing, unanchored-red/restored-green and verified archive attribution pass")
          PACKAGE
      # The gates are the pinned bundle's (decision 0050 §1): the public
      # scripts are fixed shims whose bytes must match the pinned digests,
      # and the design validator's refusal arms run as the verify seat runs
      # them.
      - run: sha256sum --check --strict bundles/self/scripts/shims.sha256
      - run: bash scripts/design-check.sh selftest
      # The operator's seal tool, proved keyless (decision 0056): no key is
      # provisioned and its signing path never runs in CI.
      - run: bash scripts/seal-branch-test.sh

  # The whole suite on every OS the realm supports — Linux and macOS (the
  # release notes name the two; there is no Windows runner in this realm).
  # --locked for the same freshness contract.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Finite: a wedged test fails in half an hour, not GitHub's 360-minute
    # default (issue #104).
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked
      # The portless bridge's real port-80 exchange (issue #133, decision
      # 0047 §4) is ignored by default — binding 127.0.0.1:80 is privileged —
      # and run here explicitly: Linux lowers the unprivileged port floor
      # first; macOS has no such knob for 127.0.0.1, so it runs the test as
      # root (the job's last step, so root-owned build output is harmless).
      - if: runner.os == 'Linux'
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          cargo test --locked --test binary -- --ignored portless_bridge_pings_port_eighty
      - if: runner.os == 'macOS'
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test --locked --test binary -- --ignored portless_bridge_pings_port_eighty

  # Exact 100% of lines, branches and functions, on every push and PR — not
  # just main. The gate never auto-installs a toolchain and refuses without
  # one: it probes `nightly` first and uses it when that toolchain carries
  # `llvm-tools`, else falls back to an installed dated `nightly-*` that
  # does (the resolution CI satisfies below by installing nightly with the
  # component). `dtolnay/rust-toolchain` with the `nightly` toolchain pin
  # supplies exactly that. The gate measures with --locked and preserves the
  # full lcov + summary under target/coverage/ even on refusal, so the
  # artifact below is burn-down evidence, not just a green check. The gate's
  # verdict is untrusted without its selftest (the gate's own header), so
  # CI runs it here as the verify seat does (issue #104).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The gate reads `cargo metadata --offline --locked` before it builds,
      # so the locked dependencies must already be on disk. A cache keyed on
      # the nightly's hash misses on every new nightly; fetch here, with the
      # network CI has, and the gate itself stays offline.
      - run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path bundles/self/scripts/coverage-fn-scan/Cargo.toml
      - run: bash scripts/coverage-gate.sh selftest
      - run: bash scripts/coverage-gate.sh
      # #123's tamper boundary by execution: an `exit 0` public gate beside an
      # uncovered line still refuses through the pinned gate (decision 0050).
      - run: bash bundles/self/scripts/delivery-proof-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-evidence
          path: target/coverage

  # License compliance stays the cargo-deny beat; the hermetic verify-seat
  # keeps exactly this check (no network).
  #
  # The rustls-only posture is proved here too, fail closed (AC52.3): the
  # native-tls probe must be *demonstrably* absent. Exit 0 means it is
  # present — refuse; a failure that does not name the absence means cargo
  # itself broke and the absence is unprovable — refuse. (The probe's
  # no-match exit code varies by cargo — 1 on some versions, 101 on
  # current — so the canonical "did not match any packages" message is the
  # stable absence contract; anything else refuses.)
  deny:
    name: deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses
      - name: Prove native-tls absent (fail closed)
        run: |
          set +e
          out=$(cargo tree -i native-tls 2>&1)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "REFUSAL: native-tls is in the dependency tree; the realm is rustls-only (AC52.3):" >&2
            echo "$out" >&2
            exit 1
          elif echo "$out" | grep -q "did not match any packages"; then
            echo "native-tls absent — rustls-only confirmed"
          else
            echo "REFUSAL: cargo tree failed (exit $code) and did not report absence; absence cannot be proved — refusing closed:" >&2
            echo "$out" >&2
            exit 1
          fi

  # RustSec advisories are CI-only: the advisory DB needs the network the
  # hermetic seat deliberately denies, and a vulnerable dependency is a CI
  # blocker, not a gate a test harness should fetch anything to enforce.
  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The delivery constitution is compiled by the *recorded* brokkr, not by
  # whatever `cargo install` would resolve today — two 0.12.0 binaries have
  # already disagreed (the bundle grammar moved). The pin lives in
  # `bundles/self/tooling.json`, an operator-owned source-and-artifact record;
  # the published binary digest, not a version string, admits execution.
  # Absent or malformed, this job refuses with the name
  # of what is wrong — fail closed, never silently skipped (AC52.1).
  brokkr-compile:
    name: brokkr bundle (pinned)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Every field is validated *before* anything reaches $GITHUB_OUTPUT —
      # a value carrying a newline could otherwise inject extra output keys
      # — and the values travel onward through `env:` only, never `${{ }}`
      # spliced into a `run:` body (decision 0019 §1, issue #104).
      - name: Read the pinned brokkr record (fail closed)
        id: tooling
        run: |
          set -euo pipefail
          record=bundles/self/tooling.json
          if [ ! -f "$record" ]; then
            echo "REFUSAL: $record is absent — the brokkr pin is an operator-owned record (docs/decisions/0045-delivery-repairs.md); the bundle cannot be compiled against a known toolchain without it, so this job refuses" >&2
            exit 1
          fi
          if ! jq -e -s 'length == 1 and (.[0].brokkr | type == "object"
              and (.sha | type == "string" and test("\\A[0-9a-f]{40}\\z"))
              and (.version | type == "string" and test("\\A(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\z")))' \
              "$record" > /dev/null; then
            echo "REFUSAL: $record is malformed — expected brokkr.sha (40 lowercase hex) and brokkr.version (major.minor.patch)" >&2
            exit 1
          fi
          if ! jq -e '.brokkr.binary_sha256 | type == "string" and test("\\A[0-9a-f]{64}\\z")' "$record" > /dev/null; then
            echo "REFUSAL: $record brokkr.binary_sha256 must be 64 lowercase hexadecimal characters" >&2
            exit 1
          fi
          if ! jq -e '.brokkr.binary_url | type == "string" and test("\\Ahttps://github\\.com/feedback-loop-ai/brokkr/releases/download/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\\z")' "$record" > /dev/null; then
            echo "REFUSAL: $record brokkr.binary_url must be a single-line HTTPS release asset URL under github.com/feedback-loop-ai/brokkr/releases/download/" >&2
            exit 1
          fi
          echo "sha=$(jq -r '.brokkr.sha' "$record")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.brokkr.version' "$record")" >> "$GITHUB_OUTPUT"
          echo "binary_sha256=$(jq -r '.brokkr.binary_sha256' "$record")" >> "$GITHUB_OUTPUT"
          echo "binary_url=$(jq -r '.brokkr.binary_url' "$record")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: feedback-loop-ai/brokkr
          ref: ${{ steps.tooling.outputs.sha }}
          path: brokkr-src
      - name: Apply the checksummed tooling patches
        run: python3 scripts/apply-brokkr-patches.py brokkr-src
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Prove the engine's review aggregation
        working-directory: brokkr-src
        run: |
          cargo test --locked -p brokkr-core policy::tests
          cargo test --locked -p brokkr-runtime --lib aggregate
          cargo test --locked -p brokkr-runtime --lib candidate_binding_tests
      # Source tests above prove patch semantics; only the published, admitted
      # executable below compiles the bundles. Live acquisition is CI-owned.
      - name: Admit the published brokkr and compile every recipe
        env:
          BINARY_URL: ${{ steps.tooling.outputs.binary_url }}
          BINARY_SHA256: ${{ steps.tooling.outputs.binary_sha256 }}
          RECORDED_VERSION: ${{ steps.tooling.outputs.version }}
        run: |
          set -euo pipefail
          engine_dir="$(mktemp -d "$RUNNER_TEMP/brokkr.XXXXXX")"
          trap 'rm -rf "$engine_dir"' EXIT
          artifact="$engine_dir/brokkr"
          if ! curl --fail --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 120 --output "$artifact" "$BINARY_URL"; then
            echo "REFUSAL: brokkr binary_url download failed: $BINARY_URL" >&2
            exit 1
          fi
          if ! observed="$(sha256sum "$artifact")"; then
            echo "REFUSAL: brokkr binary_sha256 could not be checked for $artifact" >&2
            exit 1
          fi
          observed="${observed%% *}"
          if [ "$observed" != "$BINARY_SHA256" ]; then
            echo "REFUSAL: brokkr binary_sha256 mismatch: expected $BINARY_SHA256, observed $observed" >&2
            exit 1
          fi
          chmod 700 "$artifact"
          built="$("$artifact" --version)"
          expected="brokkr $RECORDED_VERSION"
          if [ "$built" != "$expected" ]; then
            echo "REFUSAL: admitted brokkr version is '$built' but the record pins '$expected'" >&2
            exit 1
          fi
          for recipe in self codex codex-careful codex-fast; do
            output="$engine_dir/$recipe.log"
            if "$artifact" compile --bundle "bundles/$recipe" > "$output" 2>&1; then
              cat "$output"
            else
              status=$?
              cat "$output"
              echo "REFUSAL: brokkr compile --bundle bundles/$recipe failed (exit $status)" >&2
              exit "$status"
            fi
            if grep -q 'lets the run go on without reading' "$output"; then
              echo "REFUSAL: brokkr compile --bundle bundles/$recipe emitted a policy-sweep warning" >&2
              exit 1
            fi
          done

  # The 5k delivery-bound proof at release optimization, tag-scoped: a slow
  # release run must never block a PR or a main push, but a tag that cannot
  # survive its own rate proof does not publish — both publish jobs list it
  # in `needs:` and require `success` on a tag ref (issue #104). On main it
  # is skipped by its own `if:`, and the publishers admit exactly that
  # `skipped` result there and nowhere else. No `needs:` of its own — it
  # rides the same push as the gates without waiting on them.
  release-rate-5k:
    name: release rate 5k (tags only)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --release --locked --test rate -- --ignored --nocapture

  # Publication is one gated run (decision 0018 §6): the docker build cannot
  # start until the required gates of the same invocation are green — the
  # pinned brokkr compile among them — and it runs only for main and v* tag
  # refs. `main` pushes the rolling `:main` and the exact-commit
  # `:sha-<sha>` only. The `:<version>` tag publishes only when the
  # triggering ref is exactly `v<Cargo.toml version>` (publish-guard.sh,
  # full-string match) and the registry probe reports both tag forms absent
  # (404/404): an existing tag refuses, an unreadable registry refuses —
  # fail closed. A pre-push check, not registry-side immutability (GHCR
  # enforces none): a concurrent publish can still race the probe, and
  # re-publishing a version means deleting the registry tag — the
  # deliberate recovery. Both `:v<version>` and `:<version>` are pushed:
  # the two forms the docs name (issue #53).
  # NOT enforced: anything about :main/:sha-<sha> (re-publishable by design)
  # and any actor who can already push tags or delete packages.
  #
  # Admission is spelled out per prerequisite: `!cancelled()` lets the job
  # see a skipped rate proof on main, so every other need must then name
  # `success` explicitly — a failed, cancelled or skipped gate never
  # publishes. A tag needs the rate proof green; main admits only its
  # `skipped`. `packages: write` is held by this job only on those two push
  # refs: the continuous `:main` is a publication too (decisions 0018/0019).
  # The image also waits on the chart proof and the real-Docker smoke
  # (issue #141): the chart publication that follows it on a tag needs
  # this job's success, so neither artifact outruns the other's proof.
  docker:
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, deny, dependency-audit, brokkr-compile, release-rate-5k, chart-verify, docker-smoke]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.quality.result == 'success'
      && needs.test.result == 'success'
      && needs.coverage.result == 'success'
      && needs.deny.result == 'success'
      && needs.dependency-audit.result == 'success'
      && needs.brokkr-compile.result == 'success'
      && needs.chart-verify.result == 'success'
      && needs.docker-smoke.result == 'success'
      && ((github.ref == 'refs/heads/main' && needs.release-rate-5k.result == 'skipped')
        || (startsWith(github.ref, 'refs/tags/v') && needs.release-rate-5k.result == 'success'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Validated before it reaches $GITHUB_OUTPUT (decision 0019 §1).
      - name: Read the crate version (the chart's appVersion must resolve)
        id: ver
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "REFUSAL: Cargo.toml version '$version' is not the semver publish-guard.sh accepts" >&2
            exit 1
          fi
          if [[ "$version" = *-* ]]; then
            IFS=. read -r -a identifiers <<<"${version#*-}"
            for id in "${identifiers[@]}"; do
              if [[ "$id" =~ ^0[0-9]+$ ]]; then
                echo "REFUSAL: numeric prerelease identifier has a leading zero" >&2
                exit 1
              fi
            done
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard the release tag (exact ref match; refuse a republish)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: scripts/publish-guard.sh "v$VERSION" feedback-loop-ai/swarmail
      - name: Push the continuous tags (main + the exact commit)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/feedback-loop-ai/swarmail:main
            ghcr.io/feedback-loop-ai/swarmail:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push the release tags (v* refs only, both forms)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/feedback-loop-ai/swarmail:v${{ steps.ver.outputs.version }}
            ghcr.io/feedback-loop-ai/swarmail:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Helm chart: lint + render both profiles + assert the deployment
  # contract (scripts/chart-verify.sh, helm-only, no cluster) on every push
  # and PR. The packaged chart publishes only from a `v*` tag ref (decision
  # 0018 §6) — and only when the triggering ref is exactly `v<Chart.yaml
  # version>` (publish-guard.sh, full-string match; the chart's OCI tags
  # are the bare form, so the guard probes that one) and the OCI probe
  # reports that version absent (404): an existing version refuses, an
  # unreadable registry refuses — fail closed. A pre-push check, not
  # registry-side immutability (GHCR enforces none).
  # NOT enforced: a concurrent publish can still race the probe (GHCR is
  # last-writer-wins) and any actor who can already push tags or delete
  # packages; re-publishing a version means deleting the registry tag.
  #
  # Verification and publication are two jobs (issue #104): `chart-verify`
  # runs on every push and PR with a read-only token; only `chart-publish`,
  # tag refs only, holds `packages: write`, and it needs the chart proof,
  # every required gate, the tag's own rate proof and the image job green.
  #
  # The chart-bump check (issue #141, proposed 0051 §2) rides this job: a
  # change to any chart file since the event's baseline — the PR's base,
  # the push's `before`, a new branch's merge-base with main, a tag's
  # previous release tag — needs a strictly greater chart version. Full
  # history is fetched because a missing baseline refuses; it is never
  # read as "no change". The selftest proves the check on throwaway real
  # repositories before the check's verdict is trusted.
  chart-verify:
    name: helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3
      - run: python3 -c 'import yaml'
      - run: bash scripts/chart-verify.sh selftest
      - name: Chart edits carry a version bump (event baseline)
        env:
          CHART_EVENT: ${{ github.event_name }}
          CHART_REF: ${{ github.ref }}
          CHART_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CHART_PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/chart-verify.sh history
      - run: bash scripts/chart-verify.sh

  # The image as it runs (issue #141, proposed 0051 §3): a real Docker
  # build, a 250-accepted mail read back after a graceful stop and after a
  # hard kill on a named volume under the image's own uid, the quickstart's
  # `--rm` leaving no anonymous volume, and no `target/` directory at any
  # depth in the build context. Read-only; it publishes nothing.
  docker-smoke:
    name: docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash scripts/docker-smoke.sh
      - name: Prove the image carries WHATWG attribution
        run: |
          set -euo pipefail
          image="swarmail-attribution:${GITHUB_SHA}"
          scratch="$(mktemp -d)"
          container=""
          trap 'if [ -n "$container" ]; then docker rm -fv "$container"; fi; docker image rm "$image"; rm -rf "$scratch"' EXIT
          docker build --tag "$image" .
          container="$(docker create "$image")"
          docker cp "$container:/NOTICE" "$scratch/NOTICE"
          test -r "$scratch/NOTICE"
          test "$(stat -c %a "$scratch/NOTICE")" = 444
          cmp NOTICE "$scratch/NOTICE"

  # The chart names an image (`appVersion`), so it never publishes ahead of
  # it (issue #141, proposed 0051 §1): it needs the image job and requires
  # its `success` explicitly, and its preflight hands that result to the
  # guard, which also requires the appVersion image to answer 200 — a
  # missing or unreadable image refuses. A tag whose version is not
  # Cargo's fails the image guard, so it publishes neither artifact.
  # NOT transactional: a chart failure after the image pushed leaves the
  # image published; recovery is the operator's deliberate registry act
  # (decision 0019), never an automatic delete or skip.
  chart-publish:
    name: helm chart publish (tags only)
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, deny, dependency-audit, brokkr-compile, release-rate-5k, chart-verify, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.docker.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Validated before it reaches $GITHUB_OUTPUT (decision 0019 §1).
      - run: python3 -c 'import yaml'
      - name: Read the chart and image versions (appVersion must be Cargo's)
        id: chartver
        run: |
          set -euo pipefail
          metadata="$(bash scripts/chart-verify.sh metadata charts/swarmail/Chart.yaml)"
          app="$(sed -n 's/^app=//p' <<<"$metadata")"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$app" != "$cargo" ]; then
            echo "REFUSAL: Chart.yaml appVersion does not match Cargo.toml" >&2
            exit 1
          fi
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"
      - name: Preflight the chart's image (published, by a successful image job)
        env:
          APP_VERSION: ${{ steps.chartver.outputs.app }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: scripts/publish-guard.sh "v$APP_VERSION" feedback-loop-ai/swarmail bare require-present
      - name: Guard the chart version (exact ref match; refuse a republish)
        env:
          VERSION: ${{ steps.chartver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: scripts/publish-guard.sh "v$VERSION" feedback-loop-ai/charts/swarmail bare
      - name: Publish the chart (OCI, ghcr.io, v* refs only)
        run: |
          helm package charts/swarmail
          helm push swarmail-*.tgz oci://ghcr.io/feedback-loop-ai/charts
