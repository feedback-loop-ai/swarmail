name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Style and lint once, on the fast runner. --locked: a stale Cargo.lock is
  # a red gate, never a silent dependency resolve.
  quality:
    name: format, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The whole suite on every OS the realm supports — Linux and macOS per
  # decision 0063 (no windows). --locked for the same freshness contract.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # Exact 100% of lines, branches and functions, on every push and PR — not
  # just main. The gate itself pins nightly (+branch coverage needs it),
  # measures with --locked, and preserves the full lcov + summary under
  # target/coverage/ even on refusal, so the artifact below is burn-down
  # evidence, not just a green check.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/coverage-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-evidence
          path: target/coverage

  # License compliance stays the cargo-deny beat; the hermetic verify-seat
  # keeps exactly this check (no network).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses

  # RustSec advisories are CI-only: the advisory DB needs the network the
  # hermetic seat deliberately denies, and a vulnerable dependency is a CI
  # blocker, not a gate a test harness should fetch anything to enforce.
  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/feedback-loop-ai/swarmail:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
