name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Style and lint once, on the fast runner. --locked: a stale Cargo.lock is
  # a red gate, never a silent dependency resolve. The publish guard's proof
  # rides this job because both publish jobs `needs:` it (decision 0018 §6):
  # a publish step may not execute guard logic that is red (decision 0019).
  quality:
    name: format, clippy, publish guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash scripts/publish-guard-test.sh

  # The whole suite on every OS the realm supports — Linux and macOS per
  # decision 0063 (no windows). --locked for the same freshness contract.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # Exact 100% of lines, branches and functions, on every push and PR — not
  # just main. The gate itself pins nightly (+branch coverage needs it),
  # measures with --locked, and preserves the full lcov + summary under
  # target/coverage/ even on refusal, so the artifact below is burn-down
  # evidence, not just a green check.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/coverage-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-evidence
          path: target/coverage

  # License compliance stays the cargo-deny beat; the hermetic verify-seat
  # keeps exactly this check (no network).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses

  # RustSec advisories are CI-only: the advisory DB needs the network the
  # hermetic seat deliberately denies, and a vulnerable dependency is a CI
  # blocker, not a gate a test harness should fetch anything to enforce.
  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publication is one gated run (decision 0018 §6): the docker build cannot
  # start until the five gates of the same invocation are green, and it runs
  # only for main and v* tag refs. `main` pushes the rolling `:main` and the
  # exact-commit `:sha-<sha>` only. The `:<version>` tag publishes only when
  # the triggering ref is exactly `v<Cargo.toml version>` (publish-guard.sh,
  # full-string match) and the registry probe reports that tag absent (404):
  # an existing tag refuses, an unreadable registry refuses — fail closed.
  # A pre-push check, not registry-side immutability (GHCR enforces none):
  # a concurrent publish can still race the probe, and re-publishing a
  # version means deleting the registry tag — the deliberate recovery.
  # NOT enforced: anything about :main/:sha-<sha> (re-publishable by design)
  # and any actor who can already push tags or delete packages.
  docker:
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, deny, dependency-audit]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Read the crate version (the chart's appVersion must resolve)
        id: ver
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard the release tag (exact ref match; refuse a republish)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: scripts/publish-guard.sh "v$VERSION" feedback-loop-ai/swarmail
      - name: Push the continuous tags (main + the exact commit)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/feedback-loop-ai/swarmail:main
            ghcr.io/feedback-loop-ai/swarmail:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push the release tag (v* refs only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/feedback-loop-ai/swarmail:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Helm chart: lint + render both profiles + assert the deployment
  # contract (scripts/chart-verify.sh, helm-only, no cluster) on every push
  # and PR. The packaged chart publishes only from a `v*` tag ref (decision
  # 0018 §6) — and only when the triggering ref is exactly `v<Chart.yaml
  # version>` (publish-guard.sh, full-string match) and the OCI probe
  # reports that version absent (404): an existing version refuses, an
  # unreadable registry refuses — fail closed. A pre-push check, not
  # registry-side immutability (GHCR enforces none).
  # NOT enforced: a concurrent publish can still race the probe (GHCR is
  # last-writer-wins) and any actor who can already push tags or delete
  # packages; re-publishing a version means deleting the registry tag.
  chart:
    name: helm chart
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, deny, dependency-audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: bash scripts/chart-verify.sh
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the chart version (the guard binds it to the ref)
        id: chartver
        # Block scalar: the sed idiom carries `version: ` — a plain YAML
        # scalar cannot.
        run: |
          echo "version=$(sed -n 's/^version: \(.*\)/\1/p' charts/swarmail/Chart.yaml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Guard the chart version (exact ref match; refuse a republish)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.chartver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: scripts/publish-guard.sh "v$VERSION" feedback-loop-ai/charts/swarmail
      - name: Publish the chart (OCI, ghcr.io, v* refs only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          helm package charts/swarmail
          helm push swarmail-*.tgz oci://ghcr.io/feedback-loop-ai/charts
