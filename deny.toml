# License compliance for the dependency tree — the control decision 0006
# claims. cargo-deny checks every crate in Cargo.lock against this
# allowlist; anything outside it fails CI. Permissive only, in the spirit
# of the dual license: openness that imposes nothing. The list is exactly
# the licenses the locked tree needs, and docs/house-rules.md ("Dependencies")
# names every entry, CDLA-Permissive-2.0 included. An allowance nothing in
# the tree uses is dropped rather than kept "just in case": cargo-deny warns
# on an unmatched allowance, and re-adding one later is an ordinary,
# reviewed change (Zlib and CC-BY-4.0 were dropped for that reason, #142 —
# Zlib only ever appeared as an alternative in an OR expression that MIT
# already satisfies, and no dependency is CC-BY-4.0. The crate's own
# CC-BY-4.0 data file, scripts/data/html-entities.json, is not a dependency
# and is not what this list checks; docs/house-rules.md records it).
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # webpki-roots — Mozilla's root CA bundle shipped as data; CDLA-Permissive-2.0
  # is the permissive flavor of the data license family (no copyleft, no
  # field-of-use restriction) and the only license under which rustls
  # distributes the offline trust store, which the tree's rustls-tls leg
  # genuinely needs. The house rules name this allowance and its one crate,
  # so it is a tracked allowance, not a silent widening.
  "CDLA-Permissive-2.0",
]

# A new dependency needs a permissive license and a reason a human can
# defend in one sentence (house rules). If cargo-deny flags something you
# believe is permissive-but-unlisted, add the exact SPDX with a comment
# naming the crate — never broaden the allowlist to make an error go away.
