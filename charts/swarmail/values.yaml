# Default values for swarmail.
# Every knob the binary itself has is an env var (see the README); `config`
# maps SWARMAIL_* names to values and `envExtra` passes raw env entries —
# the chart adds no configuration surface of its own beyond deployment shape.

replicaCount: 1

image:
  repository: ghcr.io/feedback-loop-ai/swarmail
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
imagePullSecrets: []

service:
  type: ClusterIP
  annotations: {}
  # The SERVICE-side ports; the container always listens on 1025/1110/8025.
  ports:
    smtp: 1025
    pop3: 1110
    http: 8025

# SQLite persistence. With a data file every insert is fsynced before the
# SMTP 250 leaves, and the full state is restored before the server answers
# anything. The deployment strategy becomes Recreate while this is on: the
# store is single-replica by design (HA would need a shared database).
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Only the HTTP surface is ingressed; SMTP and POP3 are plain TCP.
  host: swarmail.local
  tls: []

# The memory relation, documented rather than invented (decision 0026 §3 as
# amended by accepted 0038): the store holds all mail resident, and a data
# file restores every persisted row before bind without applying the cap.
# `SWARMAIL_MAX_PER_INBOX` (config, above; `0` disables it) caps messages
# per inbox — it is not a global byte or RSS cap, and the inbox count is
# unlimited. Resident memory covers raw, decoded and extracted fields, the
# indexes, watcher-held mail and concurrent request buffers, plus a small
# watcher channel per distinct awaited inbox name; the data file's size on
# disk does not measure it. Size `limits.memory` from observed usage of the
# workload actually run; the chart codes no override, because a constant
# that claims to fit operator data is a guess wearing a default.
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 256Mi

# The startup window (decision 0026 §3): the data-file restore runs before
# the first listener binds (accept == stored on the first bind), so the
# startupProbe is the window in which that restore may run without the
# kubelet restarting the pod — budget = periodSeconds × failureThreshold,
# 10s × 90 = 15 minutes by default, sized against a full restore of the
# default 1 Gi PVC. A slower claim is an operator-sized value, not a crash
# loop; liveness and readiness keep their own cadence below.
startupProbe:
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 90

# Every SWARMAIL_* env knob: { "SWARMAIL_MAX_PER_INBOX": "0", ... }
# The binds are stated (decision 0030 §1): the binary's defaults are now
# loopback — right on a laptop, unreachable from a Service — so the
# deployment states 0.0.0.0 and keeps the container contract.
config:
  SWARMAIL_SMTP_LISTEN: "0.0.0.0:1025"
  SWARMAIL_POP3_LISTEN: "0.0.0.0:1110"
  SWARMAIL_HTTP_LISTEN: "0.0.0.0:8025"
# Raw env entries passthrough (valueFrom and friends).
envExtra: []

probes:
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

networkPolicy:
  enabled: false
  # Extra `from:` peers rendered verbatim into the policy's single ingress
  # rule (decision 0026 §1) — `namespaceSelector`, `podSelector` or
  # `ipBlock` entries, e.g. an out-of-namespace Prometheus:
  #   ingressPeers:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: monitoring
  #     - ipBlock:
  #         cidr: 10.0.0.0/8
  # The empty default renders exactly the same-namespace `podSelector: {}`
  # posture — an operator who sets nothing inherits it byte for byte.
  # policyTypes stays Ingress-only: no egress section exists to configure.
  ingressPeers: []

# TLS for the SMTP listener (STARTTLS; POP3 stays plaintext, no STLS), fed from an operator-supplied Secret
# named by `secretName` (decision 0026 §2). The chart mints nothing: the
# Secret must carry the standard `tls.crt`/`tls.key` keys, mounted
# read-only at /etc/swarmail/tls and handed to the binary through its own
# SWARMAIL_TLS_CERT / SWARMAIL_TLS_KEY env contract. With `enabled: false`
# the chart renders no volume, no mount and no TLS env — the listeners stay
# plaintext, byte-identical to the unset path.
tls:
  enabled: false
  secretName: ""

tests:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
