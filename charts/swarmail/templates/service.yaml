apiVersion: v1
kind: Service
metadata:
  name: {{ include "swarmail.fullname" . }}
  labels:
    {{- include "swarmail.labels" . | nindent 4 }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: smtp
      port: {{ .Values.service.ports.smtp }}
      targetPort: smtp
      protocol: TCP
    - name: pop3
      port: {{ .Values.service.ports.pop3 }}
      targetPort: pop3
      protocol: TCP
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "swarmail.selectorLabels" . | nindent 4 }}
