{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "swarmail.fullname" . }}
  labels:
    {{- include "swarmail.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      {{- include "swarmail.selectorLabels" . | nindent 6 }}
  ingress:
    # SMTP, POP3 and the HTTP surface — every port the server speaks.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 1025
        - protocol: TCP
          port: 1110
        - protocol: TCP
          port: 8025
{{- end }}
