{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "swarmail.fullname" . }}
  labels:
    {{- include "swarmail.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      {{- include "swarmail.selectorLabels" . | nindent 6 }}
  ingress:
    # SMTP, POP3 and the HTTP surface — every port the server speaks.
    # The peers are the values' `ingressPeers` rendered verbatim (decision
    # 0026 §1): the empty default leaves exactly this one same-namespace
    # `podSelector: {}` entry, so the unset posture is today's byte for
    # byte; policyTypes stays Ingress-only.
    - from:
        - podSelector: {}
        {{- with .Values.networkPolicy.ingressPeers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 1025
        - protocol: TCP
          port: 1110
        - protocol: TCP
          port: 8025
{{- end }}
