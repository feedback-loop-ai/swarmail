[package]
name = "swarmail"
version = "0.1.0"
edition = "2024"
description = "An SMTP mail mock built for a program waiting on mail: lossless bursts, per-test inboxes, wait_for assertions, chaos injection, MCP built in."
license = "MIT OR Apache-2.0"
repository = "https://github.com/feedback-loop-ai/swarmail"
readme = "README.md"
keywords = ["smtp", "email", "testing", "mock", "mcp"]
categories = ["email", "development-tools::testing"]
# The published .crate is the crate, not the repo: without an explicit
# include, packaging pulls in the delivery constitution (bundle.json,
# policy.json, realms.json), the brokkr seats and decisions, the CI
# workflow and the Dockerfile — repo furniture a crates.io consumer never
# needs. Everything the crate is (sources, embedded static assets, the
# real-protocol test suites, the criterion bench, the license texts) is
# listed; everything else stays out. Cargo.toml, Cargo.lock and README.md
# ride along automatically (the manifest, the lockfile and the file the
# `readme` field points at) and must NOT be listed: a `./name` pattern
# matches nothing — cargo matches patterns against paths without the `./`
# prefix, so `./LICENSE-MIT` silently packaged no license text at all —
# while a bare `README.md` would also sweep in agents/README.md.
# Explicit root anchors state the boundary for every include; basename
# anchors also keep nested cache license/NOTICE decoys out of the package.
# NOTICE identifies the separately licensed WHATWG data and derived table.
# Cargo.lock ships so `--locked` publishes the exact dependency graph CI
# gates against.
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/assets/**", # the README references assets/logo.svg; crates.io renders the README from the package
    # the WHATWG snapshot the entity table's inline proof embeds (decision 0049 §2) — this one file, not scripts/
    "/scripts/data/html-entities.json",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "io-std"] }
axum = "0.8"
# `rc` lets the thread view serialize the store's `Arc<Email>`s as they are —
# no per-request clone of every body.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
dashmap = "6"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
# URL-encoding of the UI's inbox hrefs (issue #56): an inbox named with a
# `#` or `?` must not be read as a fragment or query. Already in the
# dependency tree via form_urlencoded/serde_urlencoded.
percent-encoding = "2.3.2"
serde_urlencoded = "0.7"
mail-parser = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# STARTTLS on the SMTP listener — the same provider story as the webhooks:
# rustls/ring everywhere, no native-tls/openssl in the tree. rcgen mints the
# self-signed dev certs; rustls-pemfile parses the operator's PEM pair.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
# `stream::unfold` builds the SSE inbox feed out of the store's broadcast
# watcher; already in the dependency tree via axum.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[[bench]]
name = "ingest"
harness = false

# The stall bench is its own harness (it prints a before/after table, not
# criterion samples): one process, one data file, a current-thread runtime,
# and a 1 ms ticker task whose lateness IS the stall being measured.
[[bench]]
name = "writer_stall"
harness = false

# The read plane's stall bench (decision 0030): the same shape, an
# in-memory store — the parse the DATA arm awaits, the search page, the
# contains fold and the per-wake view, before and after their off-worker /
# Arc moves. CPU, not commit I/O, so no data file exists to clean.
[[bench]]
name = "read_stall"
harness = false

[dev-dependencies]
criterion = "0.7"
base64 = "0.22"
libc = "0.2"
# For the stall bench's current-thread runtime and ticker task, and for the
# binary tests, which spawn the shipped `serve` process and read its startup
# line back. Already a main dependency — this only makes the features
# visible to the test/bench targets; no new crate enters the tree.
tokio = { version = "1", features = ["rt", "time", "process"] }
# Panic-safe scratch cleanup at the persist/tls fixture helpers (issue #101):
# TempDir drop guards held for the test's whole life, so `-wal`/`-shm`
# sidecars and the tls pair die with the directory by construction and
# cleanup survives a panic — the exact job a dev-dependency already does
# better than hand-rolled measured code. Dev-only: zero runtime surface.
# MIT OR Apache-2.0; its tree (fastrand, rustix) is permissive and already
# allowlisted.
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
