[package]
name = "swarmail"
version = "0.1.0"
edition = "2024"
description = "The fastest AI-native SMTP mail mock — lossless bursts, per-test inboxes, wait_for assertions, chaos injection, MCP built in."
license = "MIT OR Apache-2.0"
repository = "https://github.com/feedback-loop-ai/swarmail"
readme = "README.md"
keywords = ["smtp", "email", "testing", "mock", "mcp"]
categories = ["email", "development-tools::testing"]
# The published .crate is the crate, not the repo: without an explicit
# include, packaging pulls in the delivery constitution (bundle.json,
# policy.json, realms.json), the brokkr seats and decisions, the CI
# workflow and the Dockerfile — repo furniture a crates.io consumer never
# needs. Everything the crate is (sources, embedded static assets, the
# real-protocol test suites, the criterion bench, the license texts) is
# listed; everything else stays out. Cargo.toml, Cargo.lock and README.md
# ride along automatically (the manifest, the lockfile and the file the
# `readme` field points at) and must NOT be listed: a `./name` pattern
# matches nothing — cargo matches patterns against paths without the `./`
# prefix, so `./LICENSE-MIT` silently packaged no license text at all —
# while a bare `README.md` would also sweep in agents/README.md.
# `LICENSE-MIT` / `LICENSE-APACHE` are basename-unique (decision 0006
# keeps these names), so the bare file names match exactly.
# Cargo.lock ships so `--locked` publishes the exact dependency graph CI
# gates against.
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "io-std"] }
axum = "0.8"
# `rc` lets the thread view serialize the store's `Arc<Email>`s as they are —
# no per-request clone of every body.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
dashmap = "6"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
serde_urlencoded = "0.7"
mail-parser = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# STARTTLS on the SMTP listener — the same provider story as the webhooks:
# rustls/ring everywhere, no native-tls/openssl in the tree. rcgen mints the
# self-signed dev certs; rustls-pemfile parses the operator's PEM pair.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
# `stream::unfold` builds the SSE inbox feed out of the store's broadcast
# watcher; already in the dependency tree via axum.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[[bench]]
name = "ingest"
harness = false

[dev-dependencies]
criterion = "0.7"
base64 = "0.22"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
