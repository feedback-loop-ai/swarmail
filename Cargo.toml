[package]
name = "swarmail"
version = "0.1.0"
edition = "2024"
description = "The fastest AI-native SMTP mail mock — lossless bursts, per-test inboxes, wait_for assertions, chaos injection, MCP built in."
license = "MIT"
repository = "https://github.com/feedback-loop-ai/swarmail"
readme = "README.md"
keywords = ["smtp", "email", "testing", "mock", "mcp"]
categories = ["email", "development-tools::testing"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "io-std"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
serde_urlencoded = "0.7"
mail-parser = "0.11"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rand = "0.9"

[[bench]]
name = "ingest"
harness = false

[dev-dependencies]
criterion = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
