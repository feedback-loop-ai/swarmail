[package]
name = "swarmail-evals"
version = "0.1.0"
edition = "2024"
description = "The agent eval harness: a fixture app that sends real mail, the v1 task suite with oracle solutions, and the trial runner (decision 0055)."
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: the harness is a tool outside the measured crate (the
# tools/coverage-fn-scan pattern, operator ruling 2026-10-18) — the root
# manifest and lock gain nothing, and the root's clippy, tests and exact
# coverage gate neither build nor measure it. Every package in this
# closure is already in the root Cargo.lock at the same version (the lock
# was seeded from the root's and pruned offline), so `--offline --locked`
# needs no network and `cargo deny check licenses` has already vetted each
# version and source. Standalone eval formatting, lint and test gates remain
# owned by #201 until its CI and verify integration lands. The manual runner
# may build once when SWARMAIL_BIN is unset.
[dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.190"
rand = "=0.9.5"
ring = "=0.17.14"
reqwest = { version = "=0.12.28", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "process", "fs"] }

[workspace]
